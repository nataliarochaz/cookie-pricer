<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ed">
  <title>Calculadora Cookie Eu Quero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">EQ</div>
        <div>
          <div class="brand-title">Calculadora Cookie Eu Quero</div>
          <div class="brand-subtitle">Ficha técnica e precificação de cookies</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="button button-quiet" data-action="export">Exportar backup</button>
        <button class="button button-primary" data-action="import-trigger">Importar backup</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-label">SEU SISTEMA</div>
        <nav class="nav-list" aria-label="Navegação principal">
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Comece aqui</button>
          <button class="nav-item" data-view="ingredients"><span class="nav-icon">◈</span>Insumos</button>
          <button class="nav-item" data-view="doughs"><span class="nav-icon">◉</span>Massas</button>
          <button class="nav-item" data-view="fillings"><span class="nav-icon">●</span>Recheios</button>
          <button class="nav-item" data-view="packaging"><span class="nav-icon">▧</span>Embalagens</button>
          <button class="nav-item" data-view="cookies"><span class="nav-icon">▦</span>Custo por cookie</button>
          <button class="nav-item" data-view="prices"><span class="nav-icon">↗</span>Preço</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="save-indicator"><span class="save-dot"></span><span id="save-status">Salvo neste navegador</span></div>
          <div class="sidebar-note">Seus dados ficam no navegador. Exporte um backup para guardar uma cópia.</div>
          <button class="text-button" data-action="reset">Restaurar dados de exemplo</button>
        </div>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1">
        <noscript>Este sistema precisa de JavaScript ativado no navegador.</noscript>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
